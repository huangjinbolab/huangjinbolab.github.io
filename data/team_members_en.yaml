sections:
  - id: postdocs
    title: Postdocs
    weight: 1
    intro: ""
    members:
      - name: Shijia Xing
        bio: >-
          Dr. Xing received her Ph.D. in Biophysics from Peking University. During her doctoral training, she mainly focused on super-resolution imaging, with an emphasis on uncovering molecular mechanisms underlying disease progression and neural activity regulation during learning and memory in zebrafish. Her current research focuses on developing novel controllable cell-therapy tools and exploring their clinical applications in the treatment of cancer, genetic disorders, metabolic diseases, and other conditions.
        photo: "/images/team/xing-shijia.png"
      - name: Yafei Tian
        bio: >-
          Dr. Tian obtained her Ph.D. from Jilin University, where she focused on targeted delivery of nucleic-acid molecules through nano-delivery systems to investigate therapeutic effects and molecular mechanisms in liver fibrosis. She is currently developing a synthetic gene circuit for autonomous control of CAR-T cytokine release syndrome, aiming to reduce acute CAR-T toxicity without compromising anti-tumor efficacy.
        photo: "/images/team/tian-yafei.png"
      - name: Ling Huang
        bio: >-
          Dr. Huang completed his joint Master's and Ph.D. program in Pathogenic Biology at the Wuhan Institute of Virology, Chinese Academy of Sciences. During his doctoral studies, he focused on rational designing and engineering of probiotic vector, aiming to expand their applications in the treatment of metabolic diseases and the development of novel inhaled vaccines. After joining this lab, his research will focus on the development and optimization of smart responsive gene delivery systems, with functional validation and therapeutic studies primarily conducted in models of metabolic diseases and cancer.
        photo: "/images/team/huang-ling.png"
  - id: staff
    title: Research Assistant / Technician
    weight: 2
    intro: ""
    members:
      - name: Lingyuan Zhu
        bio: >-
          Research Assistant. Zhu Lingyuan received her master’s degree from China Pharmaceutical University, where she focused on studying the mechanisms of tumor-related genes. She possesses cross-disciplinary practical expertise spanning both fundamental research and industrial applications, with over two years of experience in technical support at a biotechnology company. She is skilled at translating theoretical knowledge into practical and feasible experimental solutions.
        photo: "/images/team/zhu-lingyuan.png"
      - name: Chenchen Jin
        bio: >-
          Jin Chenchen holds a master's degree in Cell Biology from Sichuan Agricultural University. His research primarily focuses on obesity and health, with a particular emphasis on investigating the regulatory mechanisms underlying the antagonistic deposition between muscle and adipose tissues in mammals. He is currently a research assistant at Huang Lab, where he specializes in molecular and cell biology techniques.
        photo: "/images/team/jin-chenchen.png"
