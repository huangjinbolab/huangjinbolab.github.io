    intro: ""
    members:
      - name: Lingyuan Zhu
        bio: >-
          Research Assistant. Zhu Lingyuan received her master’s degree from China Pharmaceutical University, where she focused on studying the mechanisms of tumor-related genes. She possesses cross-disciplinary practical expertise spanning both fundamental research and industrial applications, with over two years of experience in technical support at a biotechnology company. She is skilled at translating theoretical knowledge into practical and feasible experimental solutions.
        photo: "/images/team/zhu-lingyuan.png"
