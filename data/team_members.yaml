sections:
  - id: postdocs
    title: 博士后
    weight: 1
    intro: ""
    members:
      - name: 邢诗嘉
        bio: >-
          邢博士毕业于北京大学生物物理学专业，博士期间主要致力于超分辨成像相关研究，重点探究疾病发生发展的分子机制，以及斑马鱼学习记忆过程中的神经活动调控机制。目前，其研究方向聚焦于新型可控细胞治疗工具的研发，及其在癌症、遗传性疾病、代谢性疾病等多种疾病治疗中的临床应用探索。
        photo: "/images/team/xing-shijia.png"
      - name: 田亚飞
        bio: >-
          田博士在吉林大学获得博士学位，期间，主要聚焦于通过纳米递送系统实现核酸分子的靶向递送，旨在探究其在肝纤维化中的治疗作用及分子机制。目前，她正聚焦在开发一种用于CAR-T细胞因子风暴自主控制的合成基因电路，以期在不影响CAR-T抗肿瘤功能的同时，降低CAR-T的急性毒性作用。
        photo: "/images/team/tian-yafei.png"
      - name: 黄岭
        bio: >-
          黄博士硕博连读毕业于中国科学院武汉病毒研究所病原生物学专业，博士期间主要致力于益生菌载体的理性设计与改造，拓展该平台在代谢性疾病治疗及新型吸入式疫苗开发中的应用。加入实验室后，其研究方向将聚焦于智能响应型基因递送系统的研发与优化，并重点在代谢性疾病和癌症等模型中开展功能验证与治疗研究。
        photo: "/images/team/huang-ling.png"
      - name: 王梦竹
        bio: >-
          王博士毕业于重庆大学临床医学专业，博士期间主要致力于纳米材料器官靶向技术，重点研究纳米粒肺靶向技术以及机制研究。目前聚焦于纳米粒介导电磁调控工程化细胞基因表达的体内研究，用于治疗肺癌、肺纤维化等疾病模型。
        photo: "/images/team/wang-mengzhu.png"
      - name: 张黎
        bio: >-
          张黎博士毕业于华中农业大学，博士期间主要聚焦肠道微生物代谢及其与宿主互作机制研究。目前，其研究方向致力于合成生物学重编程工程细胞的开发，靶向干预肿瘤微环境代谢，探究其在肿瘤模型中的治疗效果，开展相关功能验证，探索该工具在肿瘤治疗领域的应用潜力。
        photo: "/images/team/zhang-li.png"
  - id: staff
    title: 科助/技术员
    weight: 2
    intro: ""
    members:
      - name: 朱玲媛
        bio: >-
          科研助理。朱玲媛硕士毕业于中国药科大学，在校期间主攻肿瘤相关基因的作用机制研究。兼具基础科研与产业应用的跨界实操能力，拥有两年以上生物技术公司技术支持从业经验，擅长将专业理论转化为落地可行的实验解决方案。
        photo: "/images/team/zhu-lingyuan.png"
      - name: 金辰晨
        bio: >-
          科研助理。金辰晨硕士毕业于四川农业大学细胞生物学专业，主要从事肥胖与健康相关研究，重点探究哺乳动物肌肉组织与脂肪组织之间拮抗沉积的调控机制。目前在实验室担任科研助理一职，擅长分子生物学及细胞生物学相关实验。
        photo: "/images/team/jin-chenchen.png"
      - name: 张颖
        bio: >-
          科研助理。张颖硕士毕业于石河子大学病理学与病理生理学专业，主要从事神经炎症及脓毒症相关脑损伤研究，重点关注炎症反应、氧化应激及神经功能损伤等病理过程，以及相关药物的治疗与保护作用。硕士期间主要围绕脓毒症相关脑损伤开展动物与细胞实验，研究药物干预对神经炎症、氧化应激及认知功能损伤的改善作用。积累了较为丰富的动物与细胞实验经验。
        photo: "/images/team/zhang-ying.png"
