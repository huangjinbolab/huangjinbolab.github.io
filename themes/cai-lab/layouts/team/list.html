{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="content team-intro">{{ .Content }}</div>
{{ $membersData := site.Data.members }}
{{ if eq .Site.Language.Lang "en" }}
  {{ $membersData = site.Data.members_en }}
{{ end }}
<div class="team-section">
  {{ range $membersData }}
    <div class="team-member">
      <div class="member-photo">
      <img src="{{ .image }}" alt="{{ .name }}" />
      </div>
      <div class="member-info">
        <h2 class="member-name">{{ .name }}{{ if .role }}&nbsp;&nbsp;<span class="member-title">{{ .role }}</span>{{ end }}</h2>
        <div class="member-bio">{{ .bio | markdownify }}</div>
      </div>
    </div>
  {{ end }}
</div>
{{ end }}
