<footer class="site-footer">
  <div class="container">
    <div class="contact">
      <span>{{ site.Params.footer_text }}</span>
      <span> · {{ if eq site.Language.Lang "en" }}Contact{{ else }}联系{{ end }}: <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></span>
      <span> · {{ if eq site.Language.Lang "en" }}Address{{ else }}地址{{ end }}: {{ site.Params.address }}</span>
    </div>
  </div>
</footer>
