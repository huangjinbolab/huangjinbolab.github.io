<footer class="site-footer">
  <div class="container">
    <div class="contact">
      <div class="footer-row-primary">
        <span>{{ site.Params.footer_text }}</span>
        <span class="footer-sep"> · </span>
        <span>{{ if eq site.Language.Lang "en" }}Contact{{ else }}联系{{ end }}: <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></span>
      </div>
      <div class="footer-row-address">
        <span class="footer-address-label">{{ if eq site.Language.Lang "en" }}Address{{ else }}地址{{ end }}</span>
        <div class="footer-address-body">{{ site.Params.address }}</div>
      </div>
    </div>
  </div>
</footer>
