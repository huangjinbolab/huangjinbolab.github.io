<header class="site-header">
  <div class="header-background"></div>
  <div class="header-top">
    <div class="header-top-content">
      <div class="header-left">
        <div class="lab-info-wrapper">
          <h1 class="lab-name">{{ site.Params.lab_name }}</h1>
          <div class="lab-affiliation">
            <img src="/images/logo.png" alt="{{ site.Params.address }}" class="affiliation-logo" />
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="language-switcher">
          <span class="lang-item active" data-lang="zh-CN">中文</span>
          <span class="lang-separator">|</span>
          <span class="lang-item" data-lang="en">English</span>
        </div>
        <div class="search-box">
          <input type="text" placeholder="关键词..." />
          <button class="search-btn">🔍</button>
        </div>
      </div>
    </div>
  </div>
  <div class="header-nav">
    <button class="mobile-menu-toggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="main-nav">
      <button class="mobile-menu-close" aria-label="Close menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul>
        {{ range site.Menus.main }}
          <li class="{{ if .HasChildren }}has-children{{ end }}">
            <a href="{{ .URL }}" {{ if or (eq $.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }}class="active"{{ end }}>{{ .Name }}</a>
            {{ if .HasChildren }}
              <ul class="sub-menu">
                {{ range .Children }}
                  <li>
                    <a href="{{ .URL }}" {{ if or (eq $.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }}class="active"{{ end }}>{{ .Name }}</a>
                  </li>
                {{ end }}
              </ul>
            {{ end }}
          </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const langItems = document.querySelectorAll('.lang-item[data-lang]');
    const menuToggle = document.querySelector('.mobile-menu-toggle');
    const menuClose = document.querySelector('.mobile-menu-close');
    const mainNav = document.querySelector('.main-nav');
    const body = document.body;

    function setGoogleTranslateCookie(langCode) {
      const googtrans = '/zh-CN/' + langCode;
      const oneYear = 365 * 24 * 60 * 60;
      document.cookie = 'googtrans=' + googtrans + ';path=/;max-age=' + oneYear;
      document.cookie = 'googtrans=' + googtrans + ';path=/;domain=' + window.location.hostname + ';max-age=' + oneYear;
      localStorage.setItem('site_lang', langCode);
    }

    function updateLangUI(langCode) {
      langItems.forEach(function(item) {
        item.classList.toggle('active', item.dataset.lang === langCode);
      });
    }

    function detectCurrentLang() {
      const savedLang = localStorage.getItem('site_lang');
      if (savedLang === 'en' || savedLang === 'zh-CN') return savedLang;
      return 'zh-CN';
    }

    const currentLang = detectCurrentLang();
    updateLangUI(currentLang);

    langItems.forEach(function(item) {
      item.addEventListener('click', function() {
        const targetLang = item.dataset.lang;
        if (!targetLang || targetLang === detectCurrentLang()) return;
        setGoogleTranslateCookie(targetLang);
        updateLangUI(targetLang);
        window.location.reload();
      });
    });
    
    if (menuToggle && mainNav) {
      function openMenu() {
        mainNav.classList.add('mobile-menu-open');
        menuToggle.classList.add('active');
        menuToggle.style.opacity = '0';
        menuToggle.style.pointerEvents = 'none';
        if (menuClose) menuClose.classList.add('active');
        body.style.overflow = 'hidden'; // 防止背景滚动
      }
      
      function closeMenu() {
        mainNav.classList.remove('mobile-menu-open');
        menuToggle.classList.remove('active');
        menuToggle.style.opacity = '';
        menuToggle.style.pointerEvents = '';
        if (menuClose) menuClose.classList.remove('active');
        body.style.overflow = ''; // 恢复滚动
      }
      
      menuToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        openMenu();
      });
      
      if (menuClose) {
        menuClose.addEventListener('click', function(e) {
          e.stopPropagation();
          closeMenu();
        });
      }
      
      // 点击菜单项后关闭菜单
      const menuLinks = mainNav.querySelectorAll('a');
      menuLinks.forEach(link => {
        link.addEventListener('click', function() {
          closeMenu();
        });
      });
      
      // ESC键关闭菜单
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && mainNav.classList.contains('mobile-menu-open')) {
          closeMenu();
        }
      });
    }
  });
</script>
