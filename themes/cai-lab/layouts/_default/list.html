{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="content">{{ .Content }}</div>
<ul class="post-list">
  {{ range .Pages.ByDate.Reverse }}
    <li>
      {{ if eq .Section "news" }}
        <span class="date">{{ .Date.Format "2006-01-02" }}</span>
      {{ end }}
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
  {{ end }}
</ul>
{{ end }}
